name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check wrangler config is valid JSON-ish
        run: node -e "require('fs').readFileSync('wrangler.jsonc','utf8')"
      - name: Basic syntax check JS files
        run: |
          node --check worker.js
          node --check app.js
